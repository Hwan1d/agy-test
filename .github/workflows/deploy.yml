name: Deploy K-Traffic to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# GitHub Pages 배포 권한 설정
permissions:
  contents: read
  pages: write
  id-token: write

# 동시 배포 방지
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # GitHub Actions Secrets로부터 config.js 자동 생성 (소스코드에는 미노출)
      - name: Generate config.js from Secrets
        run: |
          cat << 'EOF' > config.js
          window.ENV = {
            KAKAO_MAP_KEY: '${{ secrets.KAKAO_MAP_KEY }}',
            ITS_API_KEY: '${{ secrets.ITS_API_KEY }}'
          };
          EOF
          echo "config.js 생성 완료"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
